<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ثبت‌نام در قرعه‌کشی</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html">صفحه اصلی</a>
    <a href="register.html">ثبت‌نام</a>
    <a href="admin.html">مشاهده ثبت‌نام‌ها</a>
  </nav>

  <div class="container">
    <h2>فرم ثبت‌نام</h2>
    <form id="signupForm">
      <label>نام و نام خانوادگی:</label>
      <input type="text" id="name" required>

      <label>رمز عبور:</label>
      <input type="password" id="password" required>

      <label>شماره موبایل:</label>
      <input type="tel" id="phone" required>

      <fieldset>
        <legend>آیا با قوانین زیر موافقی؟</legend>
        <ul>
          <li>۱. من قول می‌دهم هر ماه پولم را به موقع بزنم</li>
          <li>۲. من یک فرد خوش‌حسابی هستم</li>
          <li>۳. عضوی از خانواده بخشی‌نژاد هستم یا نسبتی با آن خانواده دارم</li>
        </ul>
        <label>
          <input type="checkbox" id="agree" required>
          با قوانین بالا موافقم
        </label>
      </fieldset>

      <button type="submit" class="btn">ثبت‌نام</button>
    </form>
    <p id="success-message" style="display: none; color: green; font-weight: bold;">
      شما با موفقیت ثبت‌نام کردید. بقیه اطلاعات از طریق پیامک ارسال می‌شود.
    </p>
  </div>

  <script>
    document.getElementById('signupForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const password = document.getElementById('password').value;
      const phone = document.getElementById('phone').value;
      const agree = document.getElementById('agree').checked;

      if (!agree) return;

      const user = { name, password, phone };

      let users = JSON.parse(localStorage.getItem('users')) || [];
      users.push(user);
      localStorage.setItem('users', JSON.stringify(users));

      document.getElementById('signupForm').style.display = 'none';
      document.getElementById('success-message').style.display = 'block';
    });
  </script>
</body>
</html>
